<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <title>Document</title>
</head>

<body>
   <header>
    <div class="flex justify-around mt-6">
        <h1>TASK MANAGEMENT</h1>
    </div>
</header>

<main>
    <section class="p-6 flex justify-evenly gap-4 flex-wrap">

        <div class="bg-[#60C1E5] rounded-xl p-4 w-80 min-h-96">
            <h2 class="text-xl font-bold text-center rounded-lg bg-white">
                À faire
            </h2>
            <div id="todo"></div>
        </div>

        <div class="bg-[#FB6C00] rounded-xl p-4 w-80 min-h-96">
            <h2 class="text-xl font-bold text-center rounded-lg bg-white">
                En cours
            </h2>
            <div id="in-progress"></div>
        </div>

        <div class="bg-[#7EC151] rounded-xl p-4 w-80 min-h-96">
            <h2 class="text-xl font-bold text-center rounded-lg bg-white">
                À Valider
            </h2>
            <div id="done"></div>
        </div>

    </section>
</main>
</body>

</html>
